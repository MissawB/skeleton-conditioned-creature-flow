data:
  num_points: 2048
  num_joints: 35
  num_samples_per_family: 100
  families:
    - felidae
    - canidae
    - equidae
    - bovidae
    - hippopotamidae
  cache_dir: "data/cache"

model:
  point_dim: 3
  hidden_dim: 256
  num_layers: 6
  num_heads: 8
  dropout: 0.05
  num_joints: 35
  spatial_distance_scale: 2.0

training:
  batch_size: 16
  learning_rate: 0.0002
  weight_decay: 0.00001
  num_epochs: 30
  save_every: 5
  device: "cuda"
  checkpoint_dir: "checkpoints"

sampling:
  num_steps: 20
  solver: "heun"
  export_dir: "viewer/data"
