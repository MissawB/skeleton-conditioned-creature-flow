data:
  num_points: 2048
  num_joints: 35
  num_samples_per_family: 100
  families:
    - felidae
    - canidae
    - equidae
    - bovidae
    - hippopotamidae
  cache_dir: "data/cache"
  ot_noise_per_sample: 0        # OT-matched noise draws precomputed per shape (0 = independent coupling)
  independent_noise_prob: 0.2   # hybrid coupling: share of independent noise during training

model:
  point_dim: 3
  hidden_dim: 256
  num_layers: 6
  num_heads: 8
  dropout: 0.05
  num_joints: 35
  spatial_distance_scale: 2.0
  fourier_octaves: 0            # sin/cos input features at pi * 2^k, k < octaves (0 = raw coordinates only)
  data_scale: 4.0               # coordinates are multiplied by this inside the network (data std ~0.25 vs noise std 1)

training:
  batch_size: 16
  learning_rate: 0.0002
  weight_decay: 0.00001
  num_epochs: 90
  lr_schedule: "constant"       # "cosine": decay from learning_rate to min_lr_ratio * learning_rate over the run
  warmup_steps: 0               # linear warmup at the start (optimizer steps)
  min_lr_ratio: 0.0
  mixed_precision: "no"         # "bf16": autocast forward and loss (about 3x faster, less memory)
  save_every: 5
  device: "cuda"
  checkpoint_dir: "checkpoints"
  late_t_prob: 0.0              # share of samples with t ~ U[late_t_min, 1] instead of U[0, 1]
  late_t_min: 0.9
  cond_drop_prob: 0.0           # share of samples trained without skeleton (classifier-free guidance)
  ema_decay: 0.995              # EMA of weights used for sampling (~200 steps, ~6 epochs here)

sampling:
  num_steps: 20
  solver: "heun"
  guidance_scale: 1.0           # > 1 strengthens skeleton conditioning (needs cond_drop_prob > 0)
  export_dir: "viewer/data"
