<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Creature Flow Viewer</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,400..600&family=Spectral:ital,wght@0,300;0,500;1,300&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <!-- Three.js and its addons as ES modules via CDN -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="canvas-container"></div>

  <header class="tag">
    <h1 id="specimen-name">Loading specimens</h1>
    <p id="specimen-family" class="family"></p>
    <p class="caption">Generated from Gaussian noise by a flow model conditioned on the skeleton.
      <a href="https://huggingface.co/collections/MissawB/skeleton-conditioned-creature-flow-6ad8fe174913aa4ba69dd554" target="_blank" rel="noopener">Model, data and code</a></p>
  </header>

  <nav class="specimens" aria-label="Specimens">
    <ul id="specimen-list"></ul>
  </nav>

  <p id="status" class="status" role="status"></p>

  <section class="flow" aria-label="Flow time">
    <div class="flow-actions">
      <button type="button" id="play-btn" class="play" aria-label="Play flow">
        <svg class="icon-play" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2.5v11l9-5.5z"/></svg>
        <svg class="icon-pause" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2.5h3v11H4zM9 2.5h3v11H9z"/></svg>
      </button>
      <div class="readout">
        <span class="t">t <output id="time-val">0.00</output></span>
        <span id="step-val" class="step">step 0 of 20</span>
      </div>
    </div>

    <div class="ruler">
      <input type="range" id="time-slider" min="0" max="1" step="0.005" value="0" aria-label="Flow time t">
      <div id="ticks" class="ticks" aria-hidden="true"></div>
      <div class="ends" aria-hidden="true"><span>Noise</span><span>Specimen</span></div>
    </div>

    <div class="flow-toggles">
      <button type="button" id="toggle-skeleton-btn" class="toggle" aria-pressed="true">Skeleton</button>
      <button type="button" id="reset-cam-btn" class="toggle">Reset view</button>
    </div>
  </section>

  <p class="facts"><span id="point-count">2048</span> points, <span id="joint-count">35</span> joints</p>

  <script type="module" src="app.js"></script>
</body>
</html>
